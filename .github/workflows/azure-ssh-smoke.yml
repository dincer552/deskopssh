name: Hattrick SSH desktop and Cloudflare readiness

on:
  push:
    branches:
      - ci/azure-ssh-smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hssh-cloudflare-readiness
  cancel-in-progress: false

jobs:
  desktop-simulation:
    name: Windows desktop build and ConPTY tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/HattrickSSH/package.json

      - name: Install terminal assets
        working-directory: src/HattrickSSH
        shell: pwsh
        run: |
          npm install --no-audit --no-fund
          New-Item -ItemType Directory -Force wwwroot/lib | Out-Null
          Copy-Item node_modules/@xterm/xterm/lib/xterm.js wwwroot/lib/xterm.js
          Copy-Item node_modules/@xterm/xterm/css/xterm.css wwwroot/lib/xterm.css
          Copy-Item node_modules/@xterm/addon-fit/lib/addon-fit.js wwwroot/lib/addon-fit.js

      - name: Generate Windows app icon
        shell: pwsh
        run: ./scripts/generate-icon.ps1

      - name: Restore
        run: dotnet restore src/HattrickSSH/HattrickSSH.csproj

      - name: Build WPF desktop application
        run: dotnet build src/HattrickSSH/HattrickSSH.csproj -c Release --no-restore -p:Version=0.1.0

      - name: Run persistence and ConPTY integration tests
        run: dotnet test tests/HattrickSSH.Persistence.Tests/HattrickSSH.Persistence.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Publish portable Windows x64 app
        shell: pwsh
        run: |
          dotnet publish src/HattrickSSH/HattrickSSH.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:Version=0.1.0 -o artifacts/publish
          if (!(Test-Path artifacts/publish/HattrickSSH.exe)) { throw "Published HattrickSSH.exe is missing." }
          Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/HattrickSSH-DesktopSimulation.zip -Force

      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: HattrickSSH-DesktopSimulation
          path: artifacts/HattrickSSH-DesktopSimulation.zip
          if-no-files-found: error
          retention-days: 7

  cloudflare-config:
    name: Validate configured Cloudflare SSH target
    runs-on: windows-latest
    timeout-minutes: 3
    env:
      SSH_HOST: ${{ vars.SSH_HOST || 'ssh.dinceryuk.com' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
      SSH_USERNAME: ${{ vars.SSH_USERNAME || 'azureuser' }}
      CLOUDFLARED_HOSTNAME: ${{ vars.CLOUDFLARED_HOSTNAME || 'ssh.dinceryuk.com' }}
    steps:
      - name: Validate target configuration without exposing credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:SSH_HOST)) { throw "SSH_HOST is missing." }
          if ($env:SSH_PORT -ne "22") { throw "Unexpected SSH_PORT; expected 22." }
          if ($env:SSH_USERNAME -ne "azureuser") { throw "Unexpected SSH_USERNAME." }
          if ($env:CLOUDFLARED_HOSTNAME -ne $env:SSH_HOST) { throw "CLOUDFLARED_HOSTNAME must match SSH_HOST." }
          Write-Host "SSH target configuration: PASS"
          Write-Host "Host: $env:SSH_HOST"
          Write-Host "Port: $env:SSH_PORT"
          Write-Host "Username: $env:SSH_USERNAME"
          Write-Host "Cloudflare hostname: $env:CLOUDFLARED_HOSTNAME"
          Write-Host "Proxy command: cloudflared access ssh --hostname $env:CLOUDFLARED_HOSTNAME"
          @"
          ### Cloudflare SSH target
          - Target configuration: **PASS**
          - SSH endpoint: `$($env:SSH_HOST):$($env:SSH_PORT)`
          - SSH username: `$($env:SSH_USERNAME)`
          - cloudflared hostname: `$($env:CLOUDFLARED_HOSTNAME)`
          - Client proxy: `cloudflared access ssh --hostname $($env:CLOUDFLARED_HOSTNAME)`
          - Authentication: **interactive Cloudflare Access browser login**
          - Azure login: **NOT TESTED in GitHub-hosted CI**
          
          GitHub-hosted runners cannot complete the user's interactive browser/identity-provider login. The desktop app performs this login on the user's Windows device. This job deliberately does not require a Cloudflare Service Token and does not read or expose the SSH private-key secret.
          "@ | Add-Content $env:GITHUB_STEP_SUMMARY
